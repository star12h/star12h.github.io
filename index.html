<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faf8f4">
<title>受保护页面</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23faf8f4'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%231a1714'/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #faf8f4;
    --ink: #1a1714;
    --muted: #6e6862;
    --rule: #e2dbd1;
    --accent: #a8492b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px;
  }
  form {
    width: 100%;
    max-width: 340px;
    border-top: 1px solid var(--ink);
    padding-top: 28px;
  }
  .label {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--accent);
    margin: 0 0 18px;
  }
  h1 {
    font-family: Georgia, "Songti SC", "Source Han Serif SC", serif;
    font-size: 23px;
    font-weight: 500;
    letter-spacing: 0.04em;
    margin: 0 0 10px;
  }
  p.hint {
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--muted);
    margin: 0 0 24px;
  }
  .field { position: relative; margin-bottom: 14px; }
  input {
    width: 100%;
    font: inherit;
    font-size: 15px;
    padding: 11px 62px 11px 13px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: #fffdfa;
    color: var(--ink);
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(168, 73, 43, 0.12);
  }
  .toggle {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.06em;
    padding: 7px 10px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.16s ease, background 0.16s ease;
  }
  .toggle:hover {
    color: var(--accent);
    background: rgba(168, 73, 43, 0.07);
  }
  .gate-btn {
    width: 100%;
    font: inherit;
    font-size: 14px;
    padding: 11px 13px;
    border: 1px solid var(--ink);
    border-radius: 6px;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
    transition: opacity 0.16s ease;
  }
  .gate-btn:hover { opacity: 0.86; }
  .gate-btn:disabled { opacity: 0.5; cursor: progress; }
  .msg {
    font-size: 13px;
    line-height: 1.6;
    color: var(--accent);
    min-height: 20px;
    margin: 12px 0 0;
  }
</style>
</head>
<body>
<form id="gate" autocomplete="off">
  <p class="label">PRIVATE</p>
  <h1>这个页面需要密码</h1>
  <p class="hint">内容已加密保存，输入密码后在本地解密显示。密码不区分大小写。</p>
  <div class="field">
    <input id="pw" type="password" placeholder="访问密码" aria-label="访问密码" autofocus required>
    <button type="button" id="toggle" class="toggle" aria-pressed="false" aria-label="显示密码">显示</button>
  </div>
  <button id="go" class="gate-btn" type="submit">打开</button>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</form>

<script>
const PAYLOAD_URL = 'site.enc';
const ITERATIONS = 250000;

function fromB64(s) {
  const clean = s.replace(/\s+/g, '');
  const bin = atob(clean);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function loadPayload() {
  const res = await fetch(PAYLOAD_URL + '?v=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('payload ' + res.status);
  return fromB64(await res.text());
}

async function unlock(password, raw) {
  const salt = raw.slice(0, 16);
  const iv = raw.slice(16, 28);
  const data = raw.slice(28);

  // 与加密端一致：去空白 + 转小写，所以大小写都能解开
  const normalized = password.trim().toLowerCase();

  const baseKey = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(normalized), 'PBKDF2', false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(plain);
}

const form = document.getElementById('gate');
const input = document.getElementById('pw');
const toggle = document.getElementById('toggle');
const button = document.getElementById('go');
const msg = document.getElementById('msg');

toggle.addEventListener('click', () => {
  const hidden = input.type === 'password';
  input.type = hidden ? 'text' : 'password';
  toggle.textContent = hidden ? '隐藏' : '显示';
  toggle.setAttribute('aria-pressed', String(hidden));
  input.focus();
});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!input.value) return;
  button.disabled = true;
  msg.textContent = '正在解密…';

  if (!window.crypto || !window.crypto.subtle) {
    msg.textContent = '当前浏览器或网址不支持解密（需要 HTTPS），换个浏览器试试。';
    button.disabled = false;
    return;
  }

  let raw;
  try {
    raw = await loadPayload();
  } catch {
    msg.textContent = '密文文件没加载成功，检查一下网络后重试。';
    button.disabled = false;
    return;
  }

  try {
    const html = await unlock(input.value, raw);
    document.open();
    document.write(html);
    document.close();
  } catch {
    msg.textContent = '密码不对，再试一次。';
    button.disabled = false;
    input.select();
  }
});
</script>
</body>
</html>
